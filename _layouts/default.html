<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ site.title | default: site.github.repository_name }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>{{ site.title | default: site.github.repository_name }}</h1>
        <img src="{{ '/assets/photo.png' | relative_url }}" alt="Profile Photo" class="profile-photo">
        <p>{{ site.description | default: site.github.project_tagline }}</p>
        
        <ul class="contact-info">
          <li><i class="fas fa-map-marker-alt"></i> New York City</li>
          <li><i class="fa-brands fa-google-scholar"></i> <a href="https://scholar.google.com/citations?user=aX_GFIgAAAAJ&hl=en&oi=ao">Google Scholar</a></li>
          <li><i class="fas fa-envelope"></i> <a href="mailto:yz4123@columbia.edu">Email</a></li>
          <li><i class="fa-brands fa-bluesky"></i> <a href="https://bsky.app/profile/yizi-zhang.bsky.social">Bluesky</a></li>
        </ul>
      </header>
      <section>
        {{ content }}
      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
