<header>
  <h1>
    <a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.repository_name }}</a>
  </h1>
  <img src="{{ '/assets/photo.png' | relative_url }}" alt="Profile photo" style="width: 220px; border-radius: 0; margin: 20px 0;">
  <p style="margin: 0 0 8px; display: flex; align-items: center; gap: 6px;">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: currentColor;">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
    </svg>
    <span>New York City</span>
  </p>
  <p style="margin: 0 0 16px; display: flex; align-items: center; gap: 6px;">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: currentColor;">
      <path d="M5 3h14a2 2 0 0 1 2 2v2H3V5a2 2 0 0 1 2-2zm-2 7h18v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7zm4 2v5h2v-5H7zm4 0v5h2v-5h-2zm4 0v5h2v-5h-2z"/>
    </svg>
    <a href="https://scholar.google.com/citations?user=aX_GFIgAAAAJ&hl=en&oi=ao">Google Scholar</a>
  </p>
  <p>{{ site.description | default: site.github.project_tagline }}</p>
</header>
